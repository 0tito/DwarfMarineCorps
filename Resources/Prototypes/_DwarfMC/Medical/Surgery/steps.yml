- type: entity
  parent: CMSurgeryStepBase
  id: DwarfSurgeryStepBoneGel
  name: Apply bone gel
  components:
  - type: CMSurgeryStep
    tool:
    - type: DwarfGelInserter
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/bone_gel.rsi
    state: bone-gel
  - type: DwarfSurgeryStepBoneGelEffect

- type: entity
