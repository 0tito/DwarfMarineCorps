- type: entity
  id: DwarfProstheticPartBase
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: Icon
    sprite: Mobs/Species/Human/parts.rsi
  - type: Damageable
    damageContainer: Inorganic
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: Gibbable
  - type: StaticPrice
    price: 200
  - type: Tag
    tags:
    - Trash
  - type: DwarfBodyPart
    dismemberable: true
    slashThreshold: 80
    bruteThreshold: 120
    burnThreshold: 300
    fractureScale: 100
    stumpBleedRate: 0
  - type: DwarfProsthetic

- type: entity
  parent: DwarfProstheticPartBase
  id: DwarfProstheticLeftArm
  name: left prosthetic arm
  description: A dark metal replacement for a missing left arm.
  components:
  - type: BodyPart
    partType: Arm
    symmetry: Left
  - type: Sprite
    state: l_arm
    color: "#3A3A3A"
  - type: Icon
    state: l_arm
    color: "#3A3A3A"

