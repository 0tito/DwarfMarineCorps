- type: entity
  id: PartDwarf
  parent: [BaseItem, BasePart]
  name: "dwarf body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: DwarfMedTorso
  name: "dwarf torso"
  parent: [PartDwarf, BaseTorso]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20
  - type: DwarfBodyPart
    dismemberable: false
    dismemberThreshold: 100
    fractureThreshold: 50

