- type: entity
  id: PartDwarf
  parent: [BaseItem, BasePart]
  name: "dwarf body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: DwarfMedTorso
  name: "dwarf torso"
  parent: [PartDwarf, BaseTorso]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20
  - type: DwarfBodyPart
    dismemberable: false
    slashThreshold: 100
    bruteThreshold: 150
    burnThreshold: 300
    fractureScale: 200
    internalBleedRate: 0.35

- type: entity
  id: DwarfMedHead
  name: "dwarf head"
  parent: [PartDwarf, BaseHead]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10
  - type: DwarfBodyPart
    dismemberable: true
    maxLocalDamage: 1000
    slashThreshold: 300
    bruteThreshold: 500
    burnThreshold: 1000
    fractureScale: 300
    internalBleedRate: 0.25
    stumpBleedRate: 1.0

